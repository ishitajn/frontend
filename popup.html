<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wingman AI</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="debug.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <span class="logo"></span>
      <span class="app-title">Wingman AI</span>
      <button id="reset-match-btn" class="icon-btn" title="Reset Match">↻</button>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
    </header>

    <div id="loading-view" class="view">
      <div class="spinner"></div>
      <p>Reading page...</p>
    </div>

    <div id="error-view" class="view hidden">
      <h3 id="error-title">Error</h3>
      <p id="error-message" class="text-secondary"></p>
    </div>

    <main id="main-view" class="view hidden">
      <section class="card">
        <div class="card-content">
          <div class="input-container">
            <div id="response-area" aria-live="polite" contenteditable="true"></div>
            <button id="clear-response-btn" class="clear-btn hidden" title="Clear">&times;</button>
          </div>

          <div id="refinement-actions" class="refinement-actions hidden">
            <button class="btn-refine" data-refine-type="funnier">Funnier</button>
            <button class="btn-refine" data-refine-type="direct">More Direct</button>
            <button class="btn-refine" data-refine-type="shorter">Shorter</button>
          </div>

          <div class="input-container">
            <textarea id="custom-instruction" data-storage-key="customInstruction" placeholder="Custom instructions..."></textarea>
            <button id="clear-instruction-btn" class="clear-btn hidden" title="Clear">&times;</button>
          </div>

          <div class="quick-toggles">
            <label class="toggle-switch"><input type="checkbox" id="question-toggle-checkbox" data-storage-key="endWithQuestion"><span>End w/ Question</span></label>
            <span class="toggle-separator">|</span>
            <label class="toggle-switch"><input type="checkbox" id="geo-context-toggle" data-storage-key="geoContextToggle"><span>Use Geo-context</span></label>
            <span class="toggle-separator">|</span>
            <label class="toggle-switch"><input type="checkbox" id="strict-goal-toggle" data-storage-key="strictGoalOverride"><span>Strict Goal</span></label>
          </div>

          <div class="generate-actions">
            <div class="action-bar">
              <button id="generate-btn" class="btn btn-primary">Generate</button>
              <button id="copy-btn" class="icon-btn btn-secondary">📋</button>
              <button id="cancel-btn" class="icon-btn btn-danger hidden">✖</button>
            </div>
            <div id="response-timer" class="response-timer">00:00</div>
            <div class="debug-toggle-container">
              <label for="debug-mode-toggle">Debug</label>
              <input type="checkbox" id="debug-mode-toggle" data-storage-key="debugModeEnabled" class="debug-checkbox">
            </div>
          </div>
        </div>
      </section>

      <div class="card">
        <div class="tabs">
          <button class="tab-link active" data-tab="tune-response">Tune Response</button>
          <button class="tab-link" data-tab="analysis">Analysis</button>
          <button class="tab-link" data-tab="topic-analysis">Topic Analysis</button>
          <button class="tab-link" data-tab="conv-analysis">Conv. Analysis</button>
        </div>
        <div id="tune-response" class="tab-content active">
          <div class="info-display" id="conversation-status-display">Status: Analyzing...</div>
          <div class="card-content">
            <div class="control-group">
              <label class="label-with-info"><span>Linguistic Style</span></label>
              <select id="linguistic-style-select" data-storage-key="linguisticStyle"></select>
            </div>
            <div class="control-group">
              <label class="label-with-info"><span>Flirt Level</span><span class="value-label" id="flirty-value-label"></span></label>
              <input type="range" id="flirty-slider" data-storage-key="flirtyValue" min="0" max="100" step="10">
            </div>
            <div class="control-group">
              <label class="label-with-info"><span>Length</span><span class="value-label" id="length-value-label"></span></label>
              <input type="range" id="length-slider" data-storage-key="lengthValue" min="0" max="100" step="10">
            </div>
            <div class="control-group">
              <label class="label-with-info"><span>Emoji Strategy</span></label>
              <select id="emoji-strategy-select" data-storage-key="emojiStrategy"></select>
            </div>
            <div class="control-group">
              <label class="label-with-info"><span>Creativity</span><span id="temperature-value-label" class="value-label"></span></label>
              <input type="range" id="temperature-slider" data-storage-key="modelTemperature" min="0" max="2" step="0.1">
            </div>
            <div class="control-group">
              <label class="label-with-info"><span>Focus</span><span id="top-p-value-label" class="value-label"></span></label>
              <input type="range" id="top-p-slider" data-storage-key="topPValue" min="0" max="1" step="0.05">
            </div>
          </div>
        </div>
        <div id="analysis" class="tab-content"></div>
        <div id="topic-analysis" class="tab-content"></div>
        <div id="conv-analysis" class="tab-content"></div>
      </div>

      <details class="card" id="geo-context-card" hidden>
        <summary class="card-header">Geo-Time Context</summary>
        <div class="card-content">
          <table class="geo-table">
            <thead><tr><th>Metric</th><th>You</th><th>Match</th></tr></thead>
            <tbody>
              <tr><td>Location</td><td id="user-location">N/A</td><td id="match-location">N/A</td></tr>
              <tr><td>Current Time</td><td id="user-time">N/A</td><td id="match-time">N/A</td></tr>
              <tr><td>Time of Day</td><td id="user-time-of-day">N/A</td><td id="match-time-of-day">N/A</td></tr>
              <tr><td>Time Zone</td><td id="user-timezone">N/A</td><td id="match-timezone">N/A</td></tr>
              <tr><td>Country</td><td id="user-country">N/A</td><td id="match-country">N/A</td></tr>
              <tr><td>Time Difference</td><td colspan="2" id="time-difference">N/A</td></tr>
              <tr><td>Distance</td><td colspan="2" id="distance-info">N/A</td></tr>
            </tbody>
          </table>
        </div>
      </details>
    </main>

    <div id="settings-view" class="view hidden">
      <div class="settings-header">
        <button id="back-btn" class="icon-btn" aria-label="Back">←</button>
        <span>Global Configuration</span>
      </div>
      <div class="card">
        <div class="card-header">Connection Details</div>
        <div class="card-content">
          <div class="control-group stacked">
            <label for="localLlamaUrl">API URL</label>
            <div class="input-with-button">
              <input type="text" id="localLlamaUrl" data-storage-key="local_llama_url">
              <button id="test-api-btn" class="btn btn-secondary">Test</button>
            </div>
          </div>
          <div class="control-group stacked"><label for="localModelName">Model Name</label><input type="text" id="localModelName" data-storage-key="local_model_name"></div>
          <div class="control-group stacked"><label for="localLlamaApiKey">API Key (Optional)</label><input type="text" id="localLlamaApiKey" data-storage-key="local_llama_api_key"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Analysis Service</div>
        <div class="card-content">
          <div class="control-group stacked">
            <label for="analysisUrl">Analysis URL</label>
            <div class="input-with-button">
              <input type="text" id="analysisUrl" data-storage-key="analysis_url">
              <button id="test-analysis-btn" class="btn btn-secondary">Test</button>
            </div>
          </div>
          <div class="control-group stacked">
            <label for="analysisType">Analysis Type</label>
            <select id="analysisType" data-storage-key="analysis_type">
              <option value="local">Local</option>
              <option value="simple">Simple</option>
              <option value="enhanced">Enhanced</option>
            </select>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Global Defaults</div>
        <div class="card-content">
          <div class="control-group stacked"><label for="user-location-select">Your Location</label><select id="user-location-select" data-storage-key="userLocationChoice"></select></div>
          <div class="control-group stacked"><label for="my-profile-setting">My Profile</label><textarea id="my-profile-setting" data-storage-key="myProfile"></textarea></div>
          <button id="master-reset-btn" class="btn btn-danger">Reset All</button>
        </div>
      </div>
    </div>
  </div>

  <div id="debug-modal-overlay" class="modal-overlay hidden"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
